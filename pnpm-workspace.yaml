packages:
  - "apps/*"
  - "packages/*"

# Dependencies whose install/build lifecycle scripts are allowed to run.
# pnpm v11 blocks these by default; we trust the ones below.
allowBuilds:
  "@clerk/shared": true
  "@tailwindcss/oxide": true
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true

# Expo SDK 56 packages are newer than the global minimumReleaseAge window;
# pnpm added these exclusions so they can be installed. Keep them.
minimumReleaseAgeExclude:
  - "@expo/cli@56.1.11"
  - "@expo/config-plugins@56.0.8"
  - "@expo/config@56.0.9"
  - "@expo/fingerprint@0.19.2"
  - "@expo/image-utils@0.10.1"
  - "@expo/metro-config@56.0.12"
  - "@expo/require-utils@56.1.3"
  - babel-preset-expo@56.0.12
  - expo-asset@56.0.14
  - expo-constants@56.0.15
  - expo-modules-autolinking@56.0.12
  - expo@56.0.4
